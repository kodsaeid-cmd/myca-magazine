<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3faff" />
    <meta name="color-scheme" content="light" />

    <script>
    // Do not fetch the rescue bundle on a healthy connection. Use it only if
    // a visible editorial photo has not loaded shortly after DOMContentLoaded.
    (function () {
      var started = false;
      function needed() {
        return Array.prototype.some.call(document.images, function (img) {
          var src = img.getAttribute('src') || '';
          if (src.indexOf('/media-check/photo-') !== 0 || img.naturalWidth > 0) return false;
          if (img.getAttribute('loading') === 'lazy' &&
              img.getBoundingClientRect().top > window.innerHeight * 1.3) return false;
          return true;
        });
      }
      function startFallback() {
        if (started || !needed()) return;
        started = true;
        var script = document.createElement('script');
        script.src = '/media-check/sample-pack.js?v=9';
        script.async = true;
        document.head.appendChild(script);
      }
      function init() {
        window.setTimeout(startFallback, 900);
        new MutationObserver(function () {
          if (!started) window.setTimeout(startFallback, 650);
        }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['src'] });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true });
      else init();
    }());
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
