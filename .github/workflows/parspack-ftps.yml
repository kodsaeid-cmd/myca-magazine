name: MYCA CMS | Experimental ParsPack FTPS

# Safety: manual-only until the first dry run and actual release are verified.
# FTP account is scoped to /home/mycabl/public_html.
on:
  # Workflow changes run a safe FTPS dry-run; publication always requires an explicit manual action.
  # Publication is NEVER enabled on a push event.
  push:
    branches: [main]
    paths:
      - '.github/workflows/parspack-ftps.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to TEMP mycablog.dandoonii.ir? Leave unchecked for dry-run'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: myca-magazine-parspack
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, validate and ${{ inputs.publish && 'publish' || 'preview FTPS changes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout magazine source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check SvelteKit
        run: npm run check

      - name: Validate PHP API and build complete CMS
        run: |
          find static/api -name '*.php' -type f -print0 | xargs -0 -n1 php -l
          npm run build

      - name: Preserve CMS routes and block search indexing on the experimental host
        shell: bash
        run: |
          set -euo pipefail
          test -s build/index.html
          test -s build/admin/index.html
          test -s build/api/index.php
          test -s build/api/homepage.php
          test -s build/api/layout.php
          test -s build/.htaccess
          test -s build/media-check/photo-care-main.jpg
          test -s build/myca-logo.svg
          test -d build/_app
          grep -F 'api/homepage.php' build/.htaccess
          grep -F 'api/stories.php' build/.htaccess
          # Never overwrite build/.htaccess with a static-only rewrite:
          # that would break the new CMS homepage, dynamic articles and editor.
          printf 'User-agent: *\\nDisallow: /\\n' > build/robots.txt
          cat >> build/.htaccess <<'HTACCESS'

          # All dandoonii.ir domains are temporary experiments.
          <IfModule mod_headers.c>
          Header always set X-Robots-Tag "noindex, nofollow"
          </IfModule>
          HTACCESS

      - name: Require configured FTP secret
        shell: bash
        env:
          FTP_PASSWORD: ${{ secrets.MYCA_FTPS_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Set MYCA_FTPS_PASSWORD under Settings > Secrets and variables > Actions before deploying."
            exit 1
          fi

      - name: FTPS ${{ inputs.publish && 'publish' || 'dry-run only (no changes)' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: mycablog.dandoonii.ir
          username: myca-deploy@mycablog.dandoonii.ir
          password: ${{ secrets.MYCA_FTPS_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./build/
          # TEMP EXPERIMENT ONLY. The cPanel FTP account's home is ALREADY public_html.
          # Adding another public_html/ would upload into the wrong folder.
          server-dir: ./
          dry-run: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish }}
          dangerous-clean-slate: false
          timeout: 60000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/cgi-bin/**
            **/.well-known/**
            **/media/uploads/**

      - name: Result
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] && [ "${{ inputs.publish }}" = 'true' ]; then
            echo 'TEMP CMS uploaded to mycablog.dandoonii.ir. Verify /admin/, /api/, /stories/ and homepage. Never deploy this noindex build to blog.mycaapp.ir.'
          else
            echo 'FTPS preview complete. Server files were NOT changed.'
          fi
