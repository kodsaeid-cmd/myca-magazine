name: MYCA Magazine | ParsPack FTPS

# Safety: manual-only until the first dry run and actual release are verified.
# FTP account is scoped to /home/mycabl/public_html.
on:
  # A workflow-file update runs a safe, read-only FTPS dry run.
  # Publication is NEVER enabled on a push event.
  push:
    branches: [main]
    paths:
      - '.github/workflows/parspack-ftps.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to live site? Leave unchecked for safe dry-run'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: myca-magazine-parspack
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, validate and ${{ inputs.publish && 'publish' || 'preview FTPS changes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout magazine source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check SvelteKit
        run: npm run check

      - name: Build complete static magazine
        run: npm run build

      - name: Prepare LiteSpeed / Apache routes
        shell: bash
        run: |
          set -euo pipefail
          test -s build/index.html
          test -s build/media-check/photo-care-main.jpg
          test -s build/myca-logo.svg
          test -d build/_app
          cat > build/.htaccess <<'HTACCESS'
          DirectoryIndex index.html
          RewriteEngine On
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteCond %{REQUEST_FILENAME}.html -f
          RewriteRule ^(.+?)/?$ $1.html [L]
          ErrorDocument 404 /404.html
          HTACCESS

      - name: Require configured FTP secret
        shell: bash
        env:
          FTP_PASSWORD: ${{ secrets.MYCA_FTPS_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Set MYCA_FTPS_PASSWORD under Settings > Secrets and variables > Actions before deploying."
            exit 1
          fi

      - name: FTPS ${{ inputs.publish && 'publish' || 'dry-run only (no changes)' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: mycablog.dandoonii.ir
          username: myca-deploy@mycablog.dandoonii.ir
          password: ${{ secrets.MYCA_FTPS_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./build/
          # The cPanel FTP account's home is ALREADY public_html.
          # Adding another public_html/ would upload into the wrong folder.
          server-dir: ./
          dry-run: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish }}
          dangerous-clean-slate: false
          timeout: 60000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/cgi-bin/**
            **/.well-known/**

      - name: Result
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] && [ "${{ inputs.publish }}" = 'true' ]; then
            echo 'FTPS published. Verify https://mycablog.dandoonii.ir/ and article/photo links.'
          else
            echo 'FTPS preview complete. Server files were NOT changed.'
          fi
