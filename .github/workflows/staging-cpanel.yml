name: MYCA CMS | experimental mycablog.dandoonii.ir

# Everything under dandoonii.ir is temporary. Do not deploy this
# noindex package to the eventual blog.mycaapp.ir production domain.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  package-experimental:
    name: Validate and package CMS for experimental magazine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate SvelteKit
        run: npm run check
      - name: Lint every PHP API and renderer
        run: |
          find static/api -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Build website and full admin CMS
        run: npm run build
      - name: Mark experimental host noindex and make ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s build/index.html
          test -s build/index.php
          ! grep -q 'HeroNewsDesk' build/index.html
          test -s build/admin/index.html
          test -s build/api/index.php
          test -s build/api/homepage.php
          test -s build/api/layout.php
          test -s build/.htaccess
          test -s build/cms-home.css
          test -s build/vazir-local.css
          test -s build/fonts/Vazir-Regular.woff2
          test -s build/fonts/Vazir-Medium.woff2
          test -s build/fonts/Vazir-Bold.woff2
          test -s build/fonts/Vazir-Light.woff2
          test -s build/myca-logo.svg

          # The entire dandoonii.ir domain is an experiment: never index.
          printf 'User-agent: *\nDisallow: /\n' > build/robots.txt
          cat >> build/.htaccess <<'HTACCESS'

          # Temporary MYCA experiment: do not index its pages.
          <IfModule mod_headers.c>
          Header always set X-Robots-Tag "noindex, nofollow"
          </IfModule>
          HTACCESS

          (cd build && zip -qr ../myca-cms-experimental.zip .)
          unzip -l myca-cms-experimental.zip | grep -F 'admin/index.html'
          unzip -l myca-cms-experimental.zip | grep -F 'api/homepage.php'
          unzip -l myca-cms-experimental.zip | grep -F '.htaccess'
      - name: Save tested package
        uses: actions/upload-artifact@v4
        with:
          name: myca-cms-experimental
          path: myca-cms-experimental.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish easy-to-download experimental release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="experimental-cms-$(git rev-parse --short HEAD)"
          gh release create "$TAG" myca-cms-experimental.zip \
            --title "MYCA CMS - EXPERIMENTAL mycablog.dandoonii.ir" \
            --notes "EXPERIMENTAL NOINDEX ONLY. Install into the existing mycablog.dandoonii.ir document root (/home/mycabl/public_html) after backup and DB migration. Reuses the configured private CMS database. Never upload this noindex bundle to blog.mycaapp.ir." \
            --prerelease --latest=false
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/myca-cms-experimental.zip"
