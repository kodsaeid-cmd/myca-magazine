name: Package MYCA CMS for isolated ParsPack staging

on:
  workflow_dispatch:
  push:
    branches:
      - feature/myca-content-studio
    paths:
      - .github/workflows/staging-cpanel.yml

permissions:
  contents: write

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate SvelteKit
        run: npm run check
      - name: Lint PHP backend
        run: |
          find static/api -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Build SvelteKit admin and PHP backend
        run: npm run build
      - name: Create isolated noindex package
        shell: bash
        run: |
          set -euo pipefail
          test -s build/admin/index.html
          test -s build/api/index.php
          test -s build/api/story.php
          test -s build/.htaccess
          printf 'User-agent: *\nDisallow: /\n' > build/robots.txt
          cat >> build/.htaccess <<'HTACCESS'

          # Do not index the staging instance.
          <IfModule mod_headers.c>
          Header always set X-Robots-Tag "noindex, nofollow"
          </IfModule>
          HTACCESS
          (
            cd build
            zip -qr ../myca-cms-staging.zip .
          )
          unzip -l myca-cms-staging.zip | grep -F 'admin/index.html'
          unzip -l myca-cms-staging.zip | grep -F 'api/index.php'
          unzip -l myca-cms-staging.zip | grep -F '.htaccess'
      - name: Upload staging bundle
        uses: actions/upload-artifact@v4
        with:
          name: myca-cms-staging
          path: myca-cms-staging.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish staging prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="staging-cms-$(git rev-parse --short HEAD)"
          gh release create "$TAG" myca-cms-staging.zip \
            --title "MYCA Content Studio - STAGING ONLY" \
            --notes "NOT FOR PRODUCTION. Extract only into isolated staging.mycablog.dandoonii.ir document root. Backend requires private MySQL configuration outside webroot. Do not place into public_html." \
            --prerelease --latest=false
          echo "Ready: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/myca-cms-staging.zip"
