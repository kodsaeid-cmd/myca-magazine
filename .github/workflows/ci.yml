name: Magazine CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: SvelteKit check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Svelte
        run: npm run check
      - name: Build
        run: npm run build
